name: medical_device
description: "ESP32 Medical Device Monitoring App - Real-time health tracking for iOS and Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Libraries
  cupertino_icons: ^1.0.2
  google_fonts: ^5.0.0
  flutter_svg: ^2.0.0
  smooth_page_indicator: ^1.0.1
  
  # State Management
  provider: ^6.0.0
  get: ^4.6.5
  
  # Networking
  http: ^1.1.0
  dio: ^5.2.0
  
  # Local Storage & Database
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Charts
  fl_chart: ^0.63.0
  syncfusion_flutter_charts: ^23.1.36
  
  # Notifications
  flutter_local_notifications: ^14.1.0
  firebase_messaging: ^14.6.0
  firebase_core: ^2.24.0
  
  # Device Sensors
  sensors_plus: ^2.0.0
  location: ^5.0.0
  permission_handler: ^11.4.3
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0
  device_info_plus: ^9.1.0
  
  # BLE Communication
  flutter_blue_plus: ^1.31.0
  
  # PDF Export
  pdf: ^3.10.4
  printing: ^5.11.0
  
  # Animations
  lottie: ^2.4.0
  animated_widget: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
